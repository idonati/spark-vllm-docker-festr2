# Cycle 34c: C34b InstantTensor + push max_model_len to 128k (single-session
# long-context focus). Trades concurrency for per-session context length.
# C34b had max_num_seqs=16 max_model_len=32k. C34c has max_num_seqs=4 max_model_len=131072.
#
# KV math at TP=8, 1 kv_head/rank, ~70 layers BF16:
#   4 seqs * 128k tokens * 10 full-attn * 640 bytes = 3.3 GB/rank
#   ~7.3 GiB KV available per C34b run → 2× headroom. Should fit.

recipe_version: "1"
name: MiMo-V2.5-Pro-C34c-LongCtx
description: "C34b + max_model_len=128k for long-codebase coding sessions"

model: festr2/MiMo-V2.5-Pro-NVFP4-MXFP8-attn-TP8
container: vllm-node-mimo-pr41797-nccl230-tfgit-sm12x

cluster_only: true
mods: []

defaults:
  port: 5001
  host: 0.0.0.0
  tensor_parallel: 8
  gpu_memory_utilization: 0.72
  max_model_len: 131072
  max_num_batched_tokens: 16384
  max_num_seqs: 4
  served_model_name: mimo-v2.5-pro

env:
  VLLM_USE_FLASHINFER_MOE_FP4: "0"
  NCCL_NVLS_ENABLE: "0"
  VLLM_USE_RAY_COMPILED_DAG_OVERLAP_COMM: "1"
  RAY_CGRAPH_get_timeout: "1800"
  NCCL_DEBUG: "WARN"
  HF_HUB_OFFLINE: "1"
  TRANSFORMERS_OFFLINE: "1"

command: |
  vllm serve festr2/MiMo-V2.5-Pro-NVFP4-MXFP8-attn-TP8 \
    --trust-remote-code \
    --kv-cache-dtype fp8 \
    -tp {tensor_parallel} \
    --pipeline-parallel-size 1 \
    --max-model-len {max_model_len} \
    --max-num-batched-tokens {max_num_batched_tokens} \
    --max-num-seqs {max_num_seqs} \
    --gpu-memory-utilization {gpu_memory_utilization} \
    --load-format instanttensor \
    --attention-backend triton_attn_diffkv \
    --moe-backend marlin \
    --speculative-config '{{"model": "festr2/MiMo-V2.5-Pro-NVFP4-MXFP8-attn-TP8", "method": "mtp", "num_speculative_tokens": 1}}' \
    --compilation-config '{{"max_cudagraph_capture_size": 16, "cudagraph_capture_sizes": [1,2,4,6,8,16]}}' \
    --reasoning-parser qwen3 \
    --served-model-name {served_model_name} \
    --host {host} \
    --port {port} \
    --distributed-executor-backend ray
